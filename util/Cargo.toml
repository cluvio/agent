[package]
name    = "util"
version = "0.1.0"
license = "MIT"
edition = "2021"

[dependencies]
base64         = "0.23.1"
humantime      = "2.1"
futures        = "0.3.31"
log            = { version = "0.1.44", package = "tracing" }
minicbor       = { version = "2.1", features = ["derive", "std", "half"] }
minicbor-io    = { version = "0.23.0", features = ["async-io"] }
rustls-pemfile = "2.2"
sealed-boxes   = { path = "../sealed-boxes" }
serde          = { version = "1.0.219", features = ["derive"] }
tokio-rustls   = { version = "0.26", default-features = false }
